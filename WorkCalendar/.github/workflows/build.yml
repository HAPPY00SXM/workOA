name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 升级 actions/checkout 到 v5
      - uses: actions/checkout@v5

      # 2. 升级 actions/setup-java 到 v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. 使用最新的 gradle/actions，并通过参数彻底禁用缓存
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # 这个参数可以彻底禁用缓存，从而绕过 400 错误
          cache-disabled: true

      # 4. 执行构建
      - name: Build APK
        run: gradle assembleDebug --no-daemon

      # 5. 上传 APK
      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: WorkCalendar-App
          path: app/build/outputs/apk/debug/*.apk
